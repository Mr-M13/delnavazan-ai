name: PostgreSQL integration
on:
  push:
  pull_request:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: delnavazan_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d delnavazan_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DZN_AI_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/delnavazan_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_postgres_integration.py
